<div class="auth-container">
  <div class="auth-card">
    <h1>FlashCard SRS</h1>
    <h2>Connexion</h2>

    <!-- Ce bloc n'existe dans la page que si errorMessage est rempli -->
    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <!-- (ngSubmit) déclenche onLogin() à la validation du formulaire,
         que ce soit par le bouton ou par la touche Entrée. -->
    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="loginData.email"
          name="email" placeholder="Votre email" required/>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" [(ngModel)]="loginData.password"
          name="password" placeholder="Votre mot de passe" required/>
      </div>
      <!-- Désactivé pendant l'attente de la réponse, pour éviter
           qu'un double clic envoie deux fois la demande. -->
      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <!-- Lien vers la page d'inscription -->
    <p>Pas encore de compte ? <a routerLink="/register">S'inscrire</a></p>
  </div>
</div>
